name: Refresh vulnerable dependency locks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh compatible dependency patches
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh frontend dependencies
        working-directory: client
        run: npm audit fix
      - name: Refresh backend dependencies
        working-directory: server
        run: npm audit fix
      - name: Publish updated dependency manifests on a temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/dependency-security-fixes
          git add client/package.json client/package-lock.json server/package.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes were required."
            exit 0
          fi
          git commit -m "chore: update vulnerable dependency versions"
          git push origin HEAD:chore/dependency-security-fixes
